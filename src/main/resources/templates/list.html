<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <h1>List Page</h1>
    <hr>
    <table>
        <thead>
        <tr>
            <th>id</th><th>pw</th><th>name</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="k : ${list}">
                <td th:text="${k.memberId}"></td>
                <td th:text="${k.pw}"></td>
                <td th:text="${k.name}"></td>
                <td>
                    <a th:href="@{/delete(id=${k.memberId})}" onclick="return confirm('정말로 삭제 하시겠습니까?')">삭제</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
